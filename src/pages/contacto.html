<!DOCTYPE html>
<html lang="es">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="../../m4play.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet">
   <title>F5FLIX</title>
</head>

<body>
   <header class="header">
      <nav class="navbar">
         <div class="navbar-logo">
            <a href="../../index.html" class="logo">F5FLIX</a>
         </div>
         <ul class="navbar-menu">
            <li><a href="./catalogo.html#peliculas">Peliculas</a></li>
            <li><a href="./catalogo.html#series">Series</a></li>
            <li><a href="./catalogo.html#lo-mas-visto">Lo Más Visto</a></li>
            <li><a href="#date-de-alta">Date de Alta</a></li>
            <li><a href="#contacto">Contacto</a></li>
         </ul>
         <div class="navbar-user">
            <a href="#" class="user-icon" aria-label="Usuario">
               <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
               </svg>
            </a>
         </div>
      </nav>
   </header>
   <main>
      <main class="forms-page" id="date-de-alta">
         <section class="form-section">
            <h2 class="section-title">Date de Alta</h2>
            <form class="form" action="" method="GET">

               <div class="form-group">
                  <label for="nombre">Nombre completo</label>
                  <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
               </div>

               <div class="form-group">
                  <label for="email">Correo electrónico</label>
                  <input type="email" id="email" name="email" placeholder="tu@email.com" required>
               </div>

               <div class="form-group">
                  <label for="fecha">Fecha de nacimiento</label>
                  <input type="date" id="fecha" name="fecha" required>
               </div>

               <div class="form-group">
                  <label>Género</label>
                  <div class="form-radio-group">
                     <label class="form-radio"><input type="radio" name="genero" value="hombre"> Hombre</label>
                     <label class="form-radio"><input type="radio" name="genero" value="mujer"> Mujer</label>
                     <label class="form-radio"><input type="radio" name="genero" value="otro"> Otro</label>
                  </div>
               </div>

               <div class="form-group">
                  <label for="pais">País</label>
                  <select id="pais" name="pais">
                     <option value="">Selecciona un país</option>
                     <option value="es">España</option>
                     <option value="mx">México</option>
                     <option value="ar">Argentina</option>
                     <option value="co">Colombia</option>
                  </select>
               </div>

               <div class="form-group">
                  <label>Géneros favoritos</label>
                  <div class="form-checkbox-group">
                     <label class="form-checkbox"><input type="checkbox" name="generos" value="accion"> Acción</label>
                     <label class="form-checkbox"><input type="checkbox" name="generos" value="comedia"> Comedia</label>
                     <label class="form-checkbox"><input type="checkbox" name="generos" value="drama"> Drama</label>
                     <label class="form-checkbox"><input type="checkbox" name="generos" value="terror"> Terror</label>
                     <label class="form-checkbox"><input type="checkbox" name="generos" value="animacion">
                        Animación</label>
                  </div>
               </div>

               <button type="submit" class="btn-primary btn-submit">Registrarse</button>
            </form>
         </section>

         <hr class="section-divider">

         <section class="form-section" id="contacto">
            <h2 class="section-title">Contacto</h2>
            <form class="form" action="" method="GET">

               <div class="form-group">
                  <label for="contact-nombre">Nombre</label>
                  <input type="text" id="contact-nombre" name="nombre" placeholder="Tu nombre" required>
               </div>

               <div class="form-group">
                  <label for="contact-email">Correo electrónico</label>
                  <input type="email" id="contact-email" name="email" placeholder="tu@email.com" required>
               </div>

               <div class="form-group">
                  <label for="asunto">Asunto</label>
                  <input type="text" id="asunto" name="asunto" placeholder="Motivo del mensaje" required>
               </div>

               <div class="form-group">
                  <label for="mensaje">Mensaje</label>
                  <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
               </div>

               <div class="form-group">
                  <label class="form-checkbox">
                     <input type="checkbox" name="privacidad" required>
                     Acepto la política de privacidad
                  </label>
               </div>

               <button type="submit" class="btn-primary btn-submit">Enviar mensaje</button>
            </form>
         </section>

      </main>

   </main>
   <footer class="footer">
      <p class="footer-copy">&copy; 2026 F5FLIX. All rights reserved.</p>
   </footer>
</body>

</html>
